# OpenMindstorms (OpenRCX / OpenNXT / OpenEV3): TrueNAS SCALE custom app
# (Apps > Discover Apps > ⋮ > Install via YAML).  App name must be lowercase: openrcx
# (kept from the first deployment, together with the share and dataset names).
#
# Built on the NAS from the source in \\TRUENAS\openrcx\src (copy it there with
# deploy-to-nas.ps1). Nothing is pulled from GitHub.
#
#   /mnt/apps/configs/openrcx/src    = \\TRUENAS\openrcx\src    (source to build)
#   /mnt/apps/configs/openrcx/certs  = \\TRUENAS\openrcx\certs  (self-signed TLS cert, made on first start)
#   /mnt/apps/configs/openrcx/stats  = \\TRUENAS\openrcx\stats  (usage counters database, stats.db)
#
# Usage dashboard: https://openrcx.vp/stats/ (or www.openmindstorms.com/stats/), opened
# with the STATS_KEY below.  Pick any long random string before installing.
#
# The site gets its own address, 192.168.68.208 (an alias on the br0 bridge), and the
# local DNS name openrcx.vp.
# Open  https://openrcx.vp  in Chrome or Edge on the PC the IR tower is plugged into.
# The certificate is self-signed: run truenas\trust-cert.ps1 once on that PC (it reads
# \\TRUENAS\openrcx\certs\server.crt) and the warning goes away for good.
# Browsers only hand out serial ports to secure pages, so http://openrcx.vp shows the
# Workbench but cannot connect to the tower unless that origin is whitelisted in
# chrome://flags/#unsafely-treat-insecure-origin-as-secure.

services:
  openrcx:
    build:
      context: /mnt/apps/configs/openrcx/src
      dockerfile: Dockerfile
    image: openrcx:local
    pull_policy: build             # rebuild from src every time the app starts
    ports:
      - 192.168.68.208:80:80       # bridge alias IP : host port : container port
      - 192.168.68.208:443:443
    volumes:
      - /mnt/apps/configs/openrcx/certs:/certs
    environment:
      SERVER_IP: 192.168.68.208            # these go into the certificate; changing them
      SERVER_NAMES: openrcx.vp,openrcx,truenas,www.openmindstorms.com,openmindstorms.com   # regenerates it on the next start
      TZ: America/Chicago
    depends_on:
      - nxc
      - stats
      - accounts
    restart: unless-stopped

  # NXC compile service for OpenNXT (the NXC compiler is a native program, so the
  # Workbench sends source here).  Reached through nginx at /api/nxc; not published.
  nxc:
    build:
      context: /mnt/apps/configs/openrcx/src/truenas/nxc-service
      dockerfile: Dockerfile
    image: openrcx-nxc:local
    pull_policy: build
    environment:
      TZ: America/Chicago
    restart: unless-stopped

  # Usage counters: anonymous events from the site into a SQLite file on the
  # stats dataset; the dashboard at /stats/ reads them with STATS_KEY.
  stats:
    build:
      context: /mnt/apps/configs/openrcx/src/truenas/stats-service
      dockerfile: Dockerfile
    image: openrcx-stats:local
    pull_policy: build
    volumes:
      - /mnt/apps/configs/openrcx/stats:/data
    environment:
      STATS_KEY: change-me-to-a-long-random-string
      TZ: America/Chicago
    restart: unless-stopped

  # Optional accounts: "Sign in with Google / GitHub" and the online program
  # library, SQLite on the accounts dataset (nightly copies in accounts/backups,
  # point a Cloud Sync task at that folder).  Register the two OAuth apps with the
  # callback URLs https://www.openmindstorms.com/api/auth/callback/google and
  # .../callback/github and paste the ids and secrets here.  With no ids set the
  # pages simply show no sign-in.
  accounts:
    build:
      context: /mnt/apps/configs/openrcx/src/truenas/accounts-service
      dockerfile: Dockerfile
    image: openrcx-accounts:local
    pull_policy: build
    volumes:
      - /mnt/apps/configs/openrcx/accounts:/data
    environment:
      SITE_URL: https://www.openmindstorms.com
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GITHUB_CLIENT_ID: ""
      GITHUB_CLIENT_SECRET: ""
      BACKUP_HOUR: "3"
      TZ: America/Chicago
    restart: unless-stopped
