# OpenRCX Workbench - nginx site config (inside the container)
#
# The site is served on both ports.  Use HTTPS (self-signed certificate, trust it
# once with truenas/trust-cert.ps1) so the browser allows Web Serial, or use HTTP
# together with chrome://flags/#unsafely-treat-insecure-origin-as-secure.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Landing: straight into the Workbench.
    location = / { return 302 /gui/OpenRCX.html; }

    # The certificate, so a PC can download and trust it: https://<host>/cert
    location = /cert { alias /certs/server.crt; default_type application/x-x509-ca-cert; add_header Content-Disposition 'attachment; filename="openrcx.crt"'; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /gui/vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
