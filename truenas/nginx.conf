# OpenRCX Workbench - nginx site config (inside the container)

server {
    listen 80;
    server_name _;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Everything else goes to HTTPS: Web Serial needs a secure context.
    location / { return 302 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    # Landing: straight into the Workbench.
    location = / { return 302 /gui/OpenRCX.html; }

    # Static files; the vendored compiler and Blockly are large, so compress and cache.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /gui/vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
