# OpenMindstorms - nginx site config (inside the container)
#
# Site layout (copied from the repo's web/ folder):
#   /            home page that launches the apps
#   /rcx/        OpenRCX Workbench
#   /nxt/        OpenNXT Workbench
#   /ev3/        OpenEV3 Workbench
#   /docs/       reference PDFs the apps link to
#   /api/nxc     NXC compile service (the "nxc" container), proxied
#
# Served on both ports.  Use HTTPS (self-signed certificate, trust it once with
# truenas/trust-cert.ps1) so the browser allows Web Serial / WebUSB, or use HTTP
# together with chrome://flags/#unsafely-treat-insecure-origin-as-secure.
# Behind the Cloudflare tunnel the public hostname comes in on port 80 with a real
# certificate at the edge, so nothing special is needed there.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Old addresses from the first deployment.
    location = /gui/OpenRCX.html { return 301 /rcx/; }
    location = /web/rcx/index.html { return 301 /rcx/; }

    # The certificate, so a PC can download and trust it: https://<host>/cert
    location = /cert { alias /certs/server.crt; default_type application/x-x509-ca-cert; add_header Content-Disposition 'attachment; filename="openmindstorms.crt"'; }

    # NXC compile service (see truenas/nxc-service/).  Large source files are fine.
    location /api/nxc {
        proxy_pass http://nxc:8081;
        proxy_read_timeout 60s;
        client_max_body_size 4m;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The vendored compiler and Blockly are large and change rarely.
    location ~ ^/(rcx|nxt|ev3)/vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
