<!doctype html>
<html><head><meta charset="utf-8"><title>OpenRCX blocks smoke test</title></head>
<body>
<pre id="out">running…</pre>
<script src="../vendor/blockly/blockly.min.js"></script>
<script src="../js/blocks.js"></script>
<script src="../vendor/webnqc/nqc.js"></script>
<script>
(async () => {
  const out = [];
  const say = t => { out.push(t); document.getElementById('out').textContent = out.join('\n'); };
  try {
    const B = OpenRCX.blocks;
    if (!B) throw new Error('blocks module did not load');
    let fails = 0;
    for (const ex of B.examples) {
      const ws = new Blockly.Workspace();
      Blockly.serialization.workspaces.load(ex.json, ws);
      const code = B.generate(ws);
      say('=== ' + ex.name + ' ===\n' + code);
      const errs = [];
      const nqc = await createWebNqc({ noInitialRun: true, print: () => {}, printErr: t => errs.push(t) });
      nqc.FS.writeFile('input.nqc', code + '\n');
      let rv; try { rv = nqc.callMain(['-Trcx2', '-Ooutput.rcx', 'input.nqc']); } catch (e) { rv = e.name === 'ExitStatus' ? e.status : -1; }
      if (rv === 0) say('compiled OK: ' + nqc.FS.readFile('output.rcx').length + ' bytes');
      else { fails++; say('COMPILE FAILED (' + rv + '): ' + errs.join(' | ')); }
      ws.dispose();
    }
    // every block type in the toolbox must have a generator and produce code without throwing
    const types = [];
    const walk = c => { for (const item of c) { if (item.kind === 'block') types.push(item.type); if (item.contents) walk(item.contents); } };
    walk(B.toolbox.contents);
    const ws2 = new Blockly.Workspace();
    const hat = ws2.newBlock('rcx_program');
    let prev = null;
    for (const t of types) {
      const b = ws2.newBlock(t);
      if (b.previousConnection) {
        if (!prev) hat.getInput('DO').connection.connect(b.previousConnection); else prev.nextConnection.connect(b.previousConnection);
        if (b.nextConnection) prev = b;
      }
    }
    const code2 = B.generate(ws2);
    say('=== all toolbox blocks ===\n' + code2);
    say(fails ? 'BLOCKS SMOKE FAIL (' + fails + ')' : 'BLOCKS SMOKE OK');
  } catch (e) { say('BLOCKS SMOKE FAIL ' + (e.stack || e)); }
})();
</script>
</body></html>
