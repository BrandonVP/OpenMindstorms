<!doctype html>
<html><head><meta charset="utf-8"><title>OpenNXT browser smoke test</title></head>
<body>
<pre id="out">running…</pre>
<script src="../js/protocol.js"></script>
<script src="../js/transports.js"></script>
<script src="../js/nxt.js"></script>
<script src="../js/sim.js"></script>
<script>
(async () => {
  const out = []; const say = t => { out.push(t); document.getElementById('out').textContent = out.join('\n'); };
  try {
    const t = new OpenNXT.sim.SimTransport({ latency: 2 });
    const nxt = new OpenNXT.NXT(t);
    const i = await nxt.deviceInfo(); say('name ' + i.name + ' fw ' + (await nxt.firmwareVersion()).firmware + ' batt ' + await nxt.batteryMv());
    const data = new Uint8Array(1000); for (let k = 0; k < 1000; k++) data[k] = k & 0xFF;
    await nxt.upload('smoke.rxe', data); say('uploaded; files: ' + (await nxt.listFiles()).map(f => f.name).join(', '));
    await nxt.startProgram('smoke.rxe'); say('running ' + await nxt.currentProgram());
    await nxt.motorsSync(75, 20, 360); say('motor C tacho ' + (await nxt.getOutputState('C')).tachoCount);
    await nxt.ultrasonicSetup(4); say('ultrasonic ' + await nxt.ultrasonicCm(4) + ' cm');
    say('SMOKE OK');
  } catch (e) { say('SMOKE FAIL ' + (e.stack || e)); }
})();
</script>
</body></html>
