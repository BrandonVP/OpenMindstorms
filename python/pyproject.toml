[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrcx"
version = "0.1.0"
description = "Program and control the LEGO Mindstorms RCX from a modern PC through a DIY or original IR tower"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
usb = ["pyusb>=1.2"]

[project.scripts]
rcx = "openrcx.cli:main"

[tool.setuptools]
packages = ["openrcx"]
