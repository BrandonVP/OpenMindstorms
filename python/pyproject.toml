[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmindstorms"
version = "0.2.0"
description = "OpenMindstorms: program and control the LEGO Mindstorms RCX, NXT and EV3 from a modern PC"
urls = { Homepage = "https://github.com/BrandonVP/OpenMindstorms", Site = "https://www.openmindstorms.com" }
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5", "hidapi>=0.14"]

[project.optional-dependencies]
usb = ["pyusb>=1.2"]

[project.scripts]
rcx = "openrcx.cli:main"
nxt = "opennxt.cli:main"
ev3 = "openev3.cli:main"

[tool.setuptools]
packages = ["openrcx", "opennxt", "openev3"]
