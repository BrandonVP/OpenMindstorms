[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmindstorms"
version = "0.2.0"
description = "Program and control the LEGO Mindstorms RCX (IR tower) and NXT (USB/Bluetooth) from a modern PC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
usb = ["pyusb>=1.2"]

[project.scripts]
rcx = "openrcx.cli:main"
nxt = "opennxt.cli:main"

[tool.setuptools]
packages = ["openrcx", "opennxt"]
